[program:Browser]
command=bash -c '
  URL=$(jq --raw-output ".url // \"http://homeassistant:8123\"" /data/options.json)
  BROWSER=$(jq --raw-output ".browser // \"luakit\"" /data/options.json)

  # Validate browser availability
  if ! command -v "$BROWSER" &> /dev/null; then
    echo "WARNING: Browser \"$BROWSER\" not available on this platform ($(uname -m))"
    echo "Note: Chromium, Firefox, and Firefox ESR are only available on amd64 and aarch64"
    echo "Falling back to luakit (lightweight browser available on all platforms)"
    BROWSER="luakit"
  fi

  # Launch selected browser
  case "$BROWSER" in
    chromium)
      mkdir -p /config/google-chrome
      touch "/config/google-chrome/First Run"
      exec chromium --guest --kiosk --no-sandbox --test-type --no-first-run --disable-dev-shm-usage --start-maximized --noerrdialogs --user-data-dir=/config/google-chrome "$URL"
      ;;
    firefox)
      exec firefox --kiosk "$URL"
      ;;
    firefox-esr)
      exec firefox-esr --kiosk "$URL"
      ;;
    luakit|*)
      exec luakit -U "$URL"
      ;;
  esac'
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
