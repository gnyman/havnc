[program:Browser]
command=bash -c '
  URL=$(jq --raw-output ".url // \"http://homeassistant:8123\"" /data/options.json)
  BROWSER=$(jq --raw-output ".browser // \"luakit\"" /data/options.json)
  PERSIST_DATA=$(jq --raw-output ".persist_data // false" /data/options.json)
  command -v "$BROWSER" > /dev/null 2>&1 || {
    echo "WARNING: Browser \"$BROWSER\" not available on this platform ($(uname -m))"
    echo "Note: Chromium, Firefox, and Firefox ESR are only available on amd64 and aarch64"
    echo "Falling back to luakit (lightweight browser available on all platforms)"
    BROWSER="luakit"
  }
  if [ "$BROWSER" = "chromium" ]
  then
    if [ "$PERSIST_DATA" = "true" ]; then
      PROFILE_DIR=/data/browser-data/chromium
    else
      PROFILE_DIR=/tmp/browser-data/chromium
    fi
    mkdir -p "$PROFILE_DIR"
    touch "$PROFILE_DIR/First Run"
    exec chromium --kiosk --no-sandbox --test-type --no-first-run --disable-dev-shm-usage --start-maximized --noerrdialogs --user-data-dir="$PROFILE_DIR" "$URL"
  elif [ "$BROWSER" = "firefox" ]
  then
    if [ "$PERSIST_DATA" = "true" ]; then
      PROFILE_DIR=/data/browser-data/firefox
      mkdir -p "$PROFILE_DIR"
      exec firefox --profile "$PROFILE_DIR" --kiosk "$URL"
    fi
    exec firefox --kiosk "$URL"
  elif [ "$BROWSER" = "firefox-esr" ]
  then
    if [ "$PERSIST_DATA" = "true" ]; then
      PROFILE_DIR=/data/browser-data/firefox-esr
      mkdir -p "$PROFILE_DIR"
      exec firefox-esr --profile "$PROFILE_DIR" --kiosk "$URL"
    fi
    exec firefox-esr --kiosk "$URL"
  else
    export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 WEBKIT_DISABLE_COMPOSITING_MODE=1
    if [ "$PERSIST_DATA" = "true" ]; then
      export XDG_DATA_HOME=/data/browser-data/luakit/data
      export XDG_CACHE_HOME=/data/browser-data/luakit/cache
      mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
    fi
    exec luakit -U "$URL"
  fi'
priority=5
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
